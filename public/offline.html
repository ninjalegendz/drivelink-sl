<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline · DriveLink</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      max-width: 380px;
      width: 100%;
      text-align: center;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    img { width: 64px; height: 64px; margin: 0 auto 18px; display: block; }
    h1 { font-size: 20px; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.01em; }
    p { font-size: 14px; line-height: 1.6; color: #475569; margin: 0 0 22px; }
    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 12px;
      transition: background 0.15s ease;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="DriveLink" />
    <h1>You're offline</h1>
    <p>We can't reach DriveLink right now. Check your connection and try again. Your verified vehicles and bookings are waiting.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
